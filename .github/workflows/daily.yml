name: 森空岛每日签到
on:
  workflow_dispatch:
permissions:
  contents: write
  actions: read
concurrency:
  group: skland-daily
  cancel-in-progress: false
jobs:
  attendance:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: 检查是否需要凌晨一点补签
        id: gate
        env:
          GITHUB_TOKEN: ${{ github.token }}
          SCHEDULE: ${{ github.event.schedule }}
        run: python retry_gate.py
      - name: 离线测试
        if: steps.gate.outputs.run == 'true'
        run: python -m unittest discover -s tests -v
      - name: 两个游戏签到
        id: sign
        if: steps.gate.outputs.run == 'true'
        env:
          SKLAND_TOKENS: ${{ secrets.SKLAND_TOKENS }}
          SKLAND_DID: ${{ secrets.SKLAND_DID }}
        # pipefail 确保脚本失败不会被 tee 掩盖。
        shell: bash
        run: |
          set -o pipefail
          python -u skland.py 2>&1 | tee sign-result.txt
      - name: 发送邮件回执
        if: ${{ always() && !cancelled() && steps.gate.outputs.run == 'true' }}
        env:
          SIGN_OUTCOME: ${{ steps.sign.outcome }}
          SMTP_HOST: ${{ secrets.SMTP_HOST }}
          SMTP_PORT: ${{ secrets.SMTP_PORT }}
          SMTP_USER: ${{ secrets.SMTP_USER }}
          SMTP_PASSWORD: ${{ secrets.SMTP_PASSWORD }}
          MAIL_TO: ${{ secrets.MAIL_TO }}
          SKLAND_TOKENS: ${{ secrets.SKLAND_TOKENS }}
          SKLAND_DID: ${{ secrets.SKLAND_DID }}
        run: python notify.py
